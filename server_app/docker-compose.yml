
version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: mytaskdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  app:
    build: .
    depends_on:
      - db
    environment:
      JDBC_DATABASE_URL: jdbc:postgresql://db:5432/mytaskdb
      DB_USER: postgres
      DB_PASS: postgres
      # Dev defaults. For a real deployment set APP_ENV=production and a strong JWT_SECRET (the server refuses weak ones).
      APP_ENV: development
      JWT_SECRET: "change_me_replace_with_secure_value"
      # Enables GET /diagnostics/errors (send it as the X-Dev-Key header). Leave empty to disable.
      DEV_API_KEY: "dev-key-change-me"
      ACCESS_TOKEN_MS: 900000
      REFRESH_TOKEN_MS: 2592000000
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  pgdata:
